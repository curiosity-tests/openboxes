name: Test Pull Request
run-name: "Test Pull Request ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

# Runs all tests whenever a pull request is created or updated.
on:
  # Use pull_request instead of pull_request_target for security purposes and so that tests run on the source branch
  # (ie the PR branch), not the target branch.
  pull_request:
    types: [opened, synchronize]

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  run-frontend-tests:
    uses: ./.github/workflows/frontend-tests.yml
    secrets: inherit

  run-backend-tests:
    if: false   # racecar: scan/report reusable workflow
    uses: ./.github/workflows/backend-tests.yml
    secrets: inherit
